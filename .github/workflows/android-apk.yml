name: Build Android APK

# Builds a real, installable, signed APK and publishes it as a downloadable
# artifact + GitHub Release asset.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Add Firebase config (optional, enables phone push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No GOOGLE_SERVICES_JSON secret set - building without Firebase push."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build signed release APK
        working-directory: android
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ar-pixelgram.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-pixelgram-apk
          path: out/ar-pixelgram.apk

      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AR Pixelgram - latest APK
          body: |
            Latest AR Pixelgram Android build (signed release APK).
            Download `ar-pixelgram.apk` below and install it on your phone.
          files: out/ar-pixelgram.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
