services:
  - type: web
    name: ar-pixelgram-music-api
    runtime: node
    plan: free
    buildCommand: node --check server.mjs
    startCommand: node server.mjs
    healthCheckPath: /healthz
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://ar-pixelgram.onrender.com
  - type: web
    name: ar-pixelgram
    env: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_MUSIC_API_URL
        value: https://ar-pixelgram-music-api.onrender.com
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
