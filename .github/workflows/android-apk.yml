name: Build Android APK

# Builds a real, installable, signed APK and publishes it as a downloadable
# artifact + GitHub Release asset.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Ek time pe sirf ek build. Beech me aaye pushes queue me rukte hain (cancel nahi),
# aur agla build hamesha main ka sabse naya code leta hai — isliye har change
# kisi na kisi version me zaroor aata hai, koi version number double/skip nahi hota.
concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build:
    # version bump wala commit ("[skip apk]") APK build na kare — warna loop ban jayega
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # bump commit ka rebase/push ke liye poora history
          ref: main        # hamesha latest main (pichhle build ka version bump bhi)

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Version sirf version.json se aata hai (run number se nahi). Isliye har
      # release par version exactly +1 badhta hai — koi 54/55 gayab nahi hota.
      - name: Read app version
        run: |
          BUILD=$(node -e "console.log(require('./version.json').build)")
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
          echo "APP_VERSION_NAME=1.4.$BUILD" >> $GITHUB_ENV
          echo "APK version: 1.4.$BUILD (versionCode $((100+BUILD)))"

      # Build se pehle pakdo: koi import aisi file se aa raha hai jo repo me
      # commit hi nahi hui (aisa hone par build 'Could not load ...' par fail hota hai)
      - name: Check imports are committed
        run: node .rules/check-imports.mjs

      - name: Build web bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Add Firebase config (optional, enables phone push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "No GOOGLE_SERVICES_JSON secret set - building without Firebase push."
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build signed release APK
        working-directory: android
        env:
          JAVA_HOME: /usr/lib/jvm/temurin-21-jdk-amd64
          APP_BUILD: ${{ env.APP_BUILD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk out/ar-pixelgram.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ar-pixelgram-apk
          path: out/ar-pixelgram.apk

      - name: Publish APK to "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AR Pixelgram - latest APK
          body: |
            Latest AR Pixelgram Android build (signed release APK).
            Download `ar-pixelgram.apk` below and install it on your phone.
          files: out/ar-pixelgram.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Release sach me publish hone ke baad hi next version bump — isliye
      # fail hue builds koi version number "kha" nahi jaate.
      - name: Bump version for next release
        if: github.ref == 'refs/heads/main'
        run: |
          NEXT=$((APP_BUILD + 1))
          # published = jo APK abhi release me hai (app isse update dikhata hai)
          # build       = agla number (agli baar build hoga)
          node -e "const fs=require('fs');const v=require('./version.json');v.published=$APP_BUILD;v.build=$NEXT;fs.writeFileSync('version.json',JSON.stringify(v,null,2)+'\n')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore(release): published 1.4.$APP_BUILD, next 1.4.$NEXT [skip apk]"
          # koi aur push beech me aaya ho to rebase karke push (conflict na ho)
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --autostash origin main || true
            if git push; then exit 0; fi
            sleep 5
          done
          exit 1
